[project]
name = "mawapress-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "nh3>=0.2.18",
  "unidecode>=1.3.8",
  "redis>=5.2",
  "arq>=0.28.0",
  "pillow>=13.0.0",
  "boto3>=1.43.114",
  "python-multipart>=0.0.32",
  "mammoth>=1.13.0",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "python-docx>=1.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
